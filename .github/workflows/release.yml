# 发布流水线：push main = 自动打 tag + 构建 jar + 构建镜像 + 出 Release
#
# 触发：
#   push 到 main        → 自动版本 v1.0.<run_number>，打 tag 并发布
#   push tag v*         → 用该 tag 发布（手动指定版本的场景）
#   workflow_dispatch   → 可手填版本号
#
# 产物：
#   kudu-console.jar / .sha256                      直接 java -jar 或 upgrade.sh
#   ghcr.io/999bug/kudu-console:<tag> 与 :latest     docker pull
#   kudu-console-image-<tag>.tar.gz                 完全离线时 docker load
#
# 部署端更新代码：docker compose -f docker-compose.prod.yml pull && up -d
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.5）；留空则自动 v1.0.<run_number>'
        required: false
        type: string

permissions:
  contents: write   # 打 tag、建 Release
  packages: write   # 推 ghcr.io

# 同一分支不并发发布，避免两个 run 抢同一个版本号
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本: $V"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify frontend output
        run: test -f src/main/resources/static/index.html

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Checksum
        run: |
          cd target
          sha256sum kudu-console.jar > kudu-console.jar.sha256
          cat kudu-console.jar.sha256

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kudu-console:${{ steps.ver.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/kudu-console:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/kudu-console" \
            -f visibility=public || true

      - name: Export offline image
        run: |
          V="${{ steps.ver.outputs.value }}"
          IMG="ghcr.io/${{ github.repository_owner }}/kudu-console:$V"
          docker pull "$IMG"
          docker tag "$IMG" "kudu-console:$V"
          # 两个名字一起打包：导入后 compose 的 IMAGE 直接命中，
          # 否则本地只有短名，up -d 会当成缺镜像重新拉全量
          docker save "kudu-console:$V" "$IMG" | gzip -1 > "kudu-console-image-$V.tar.gz"
          ls -lh "kudu-console-image-$V.tar.gz"

      # 可选：同步一份到国内镜像仓库（阿里云 ACR / 腾讯云 TCR / 华为云 SWR 都兼容）。
      # 没配 secrets 就跳过，不影响 ghcr 这条主链路。
      # 需要的 secrets：ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD
      - name: Mirror to domestic registry
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_PASSWORD" ] || [ -z "$ACR_REGISTRY" ]; then
            echo "未配置 ACR_* secrets，跳过国内镜像同步"
            exit 0
          fi
          V="${{ steps.ver.outputs.value }}"
          SRC="ghcr.io/${{ github.repository_owner }}/kudu-console:$V"
          DST="$ACR_REGISTRY/$ACR_NAMESPACE/kudu-console"
          echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
            --username "$ACR_USERNAME" --password-stdin
          docker tag "$SRC" "$DST:$V"
          docker tag "$SRC" "$DST:latest"
          docker push "$DST:$V"
          docker push "$DST:latest"
          echo "已同步到 $DST:$V"

      # push 分支时补一个 tag，回滚时能按版本号 checkout；
      # GITHUB_TOKEN 推的 tag 不会再触发 workflow，不会递归
      - name: Push tag
        if: github.ref_type == 'branch'
        run: |
          V="${{ steps.ver.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$V" 2>/dev/null || echo "本地 tag 已存在"
          git push origin "$V" 2>/dev/null || echo "远端 tag 已存在"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.value }}"
          gh release view "$V" >/dev/null 2>&1 \
            || gh release create "$V" --title "$V" --generate-notes
          gh release upload "$V" \
            target/kudu-console.jar \
            target/kudu-console.jar.sha256 \
            "kudu-console-image-$V.tar.gz" \
            --clobber

      # Release 会随每次 push 增长，只保留最近 20 个（tag 全部保留）
      - name: Prune old releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +21 \
            | while read -r t; do
                [ -n "$t" ] && gh release delete "$t" --yes
              done
