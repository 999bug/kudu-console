# 发布：打 tag 即产出可下载的 jar + 校验和，供服务器上的 upgrade.sh 在线升级
#
# 用法：
#   git tag v1.0.1 && git push origin v1.0.1
#   或 Actions → Release → Run workflow → 填版本号（如 v1.0.1）
#
# 产物：kudu-console.jar、kudu-console.jar.sha256
# 升级端只认 sha256 对得上的 jar，下载损坏不会覆盖线上旧版。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v1.0.1（留空则用 pom 版本）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test backend
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Checksum
        run: |
          cd target
          sha256sum kudu-console.jar > kudu-console.jar.sha256
          cat kudu-console.jar.sha256

      # tag 触发用 tag 名；手动触发用输入值，缺省回落到 pom 版本
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
            echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" \
            target/kudu-console.jar \
            target/kudu-console.jar.sha256 \
            --title "$TAG" \
            --generate-notes \
            --latest
