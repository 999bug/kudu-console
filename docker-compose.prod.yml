# 生产编排：镜像来自 registry，不依赖源码，也不需要在本机构建
#
# 首次部署：
#   cp .env.example .env && vi .env
#   docker compose -f docker-compose.prod.yml up -d
#
# 升级（拉新镜像后重建容器）：
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 固定版本 / 回滚：在 .env 里设 IMAGE=ghcr.io/999bug/kudu-console:v1.0.1 再 up -d
#
# 镜像来自 .github/workflows/docker-image.yml，push tag 时自动构建推送。
services:
  kudu-console:
    image: ${IMAGE:-ghcr.io/999bug/kudu-console:latest}
    container_name: kudu-console
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8088"
    environment:
      KUDUCONSOLE_MASTERS: "${KUDU_MASTERS:-192.168.46.23:7051,192.168.46.23:7151,192.168.46.23:7251}"
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx1g}"
      TZ: Asia/Shanghai
    volumes:
      # 只有配置和日志需要持久化，jar 已经在镜像里
      - ./data/config:/app/config
      - ./data/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # 可选：公网访问。用法见 README「公网访问」，务必同时配 Cloudflare Access 白名单
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kudu-console-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - kudu-console
    profiles: ["tunnel"]
